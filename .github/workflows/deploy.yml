name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Database Changes
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 3. Conectar con el proyecto de Supabase
      - name: Link Supabase project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # 4. Aplicar las migrations pendientes
      - name: Push database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # 5. Re-aplicar vistas y funciones
      - name: Apply database objects
        run: |
          for DIR in supabase/objects/views \
                     supabase/objects/functions \
                     supabase/objects/procedures; do

            [ -d "$DIR" ] || continue

            for FILE in $(find "$DIR" -name "*.sql" | sort); do
              echo "Applying $FILE..."

              SQL=$(cat "$FILE")

              curl -s -X POST \
                "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"query\": $(echo "$SQL" | jq -Rs .)}"
            done
          done

        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}