name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Database Changes
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instalar Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 3. Aplicar migraciones pendientes
      - name: Push database migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

      # 4. Instalar cliente PostgreSQL
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 5. Aplicar vistas y funciones
      - name: Apply database objects
        run: |
          for DIR in supabase/objects/views \
                     supabase/objects/functions \
                     supabase/objects/procedures; do

            [ -d "$DIR" ] || continue

            for FILE in $(find "$DIR" -name "*.sql" | sort); do
              echo "Applying $FILE..."
              psql "${{ secrets.SUPABASE_DB_URL }}" -v ON_ERROR_STOP=1 -f "$FILE"
            done
          done